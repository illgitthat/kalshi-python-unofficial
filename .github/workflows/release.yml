name: Release package

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Upgrade and install dependencies
        run: uv sync --upgrade --all-groups --all-extras

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$version"

      - name: Check package
        run: |
          uv run ruff format --check kalshi tests docs/source/conf.py
          uv run ruff check kalshi tests docs/source/conf.py
          uv run pytest -q
          uv run pyright kalshi/auth.py kalshi/constants.py kalshi/rest kalshi/websocket
          uv run --group docs sphinx-build -W -b html docs/source /tmp/kalshi-docs

      - name: Build package
        run: uv build

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber
