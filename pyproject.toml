[project]
name = "kalshi-python-unofficial"
version = "0.2.0"
description = "A lightweight, unofficial Python client for the Kalshi API"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=46",
    "orjson>=3.10",
    "requests>=2.32",
    "websockets>=15",
]

[project.optional-dependencies]
analytics = [
    "matplotlib>=3.10",
    "numpy>=2",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/illgitthat/kalshi-python-unofficial"
Repository = "https://github.com/illgitthat/kalshi-python-unofficial"

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pre-commit>=4",
    "pyright>=1.1.400",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]
docs = [
    "sphinx>=8",
    "sphinx-autodoc-typehints>=3",
    "sphinx-rtd-theme>=3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kalshi"
module-root = ""
source-include = [
    "docs/**",
    "tests/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["kalshi"]
exclude = ["kalshi/utils.py"]
pythonVersion = "3.14"

[tool.ruff]
target-version = "py314"
